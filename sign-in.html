<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>Sign In</title>
    <link rel="stylesheet" href="./css/sign-in.css">
</head>
<body>

    <div class="card">
        <h1>Sign In</h1>

        <div class="social-buttons">
            <button class="btn-social btn-facebook">Sign In With Facebook</button>
            <button class="btn-social btn-google">Sign In With Google+</button>
        </div>

        <div class="or-text">Or</div>

        <input type="text" placeholder="User Name">
        <input type="password" placeholder="Password">

        <label class="remember-me">
            <input type="checkbox">
            Remember Me
        </label>

        <button class="btn-signin">Sign In</button>

        <a href="#" class="forgot-password">Forget Password?</a>

        <hr>

        <button class="btn-signup">Sign Up New Account</button>
    </div>

</body>
</html>
